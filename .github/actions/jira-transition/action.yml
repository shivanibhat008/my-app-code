name: "Transition Jira Ticket & Fetch Fix Version"
description: "Extracts a Jira issue key, fetches its Fix Version, and moves the ticket to a target status."

inputs:
  jira-base-url:
    description: "Your Jira instance URL (e.g., https://atlassian.net)"
    required: true
  jira-user-email:
    description: "Email address of the Jira service account"
    required: true
  jira-api-token:
    description: "Atlassian API token"
    required: true
  source-text:
    description: "Text containing the Jira issue key (e.g., PR title or branch name)"
    required: true
  target-status:
    description: "Target workflow state name (e.g., In Review, In Progress, Done)"
    required: true

outputs:
  issue-key:
    description: "The extracted Jira issue key"
    value: ${{ steps.extract-key.outputs.key }}
  fix-version:
    description: "The primary Fix Version assigned to the Jira ticket"
    value: ${{ steps.fetch-version.outputs.fix-version }}

runs:
  using: "composite"
  steps:
    - name: Extract Jira Issue Key
      id: extract-key
      shell: bash
      env:
        SOURCE_TEXT: ${{ inputs.source-text }}
      run: |
        ISSUE_KEY=$(echo "$SOURCE_TEXT" | grep -oE '[A-Z][A-Z0-9]+-[0-9]+' | head -n 1)
        if [ -z "$ISSUE_KEY" ]; then
          echo "No Jira issue key found in: $SOURCE_TEXT"
          exit 1
        fi
        echo "Found Jira issue key: $ISSUE_KEY"
        echo "key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"

    - name: Fetch Fix Version from Jira
      id: fetch-version
      shell: bash
      env:
        JIRA_BASE_URL: ${{ inputs.jira-base-url }}
        JIRA_EMAIL: ${{ inputs.jira-user-email }}
        JIRA_TOKEN: ${{ inputs.jira-api-token }}
        ISSUE_KEY: ${{ steps.extract-key.outputs.key }}
      run: |
        AUTH_HEADER=$(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_TOKEN" | base64 -w 0)

        ISSUE_JSON=$(curl -s -f -X GET \
          -H "Authorization: Basic $AUTH_HEADER" \
          -H "Accept: application/json" \
          "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}?fields=fixVersions")

        # Extract the first Fix Version name (or empty string if none is set)
        FIX_VERSION=$(echo "$ISSUE_JSON" | jq -r '.fields.fixVersions[0].name // empty')

        if [ -z "$FIX_VERSION" ]; then
          echo "Warning: No Fix Version set on $ISSUE_KEY."
        else
          echo "Fetched Fix Version: $FIX_VERSION"
        fi

        echo "fix-version=$FIX_VERSION" >> "$GITHUB_OUTPUT"

    - name: Transition Jira Issue
      shell: bash
      env:
        JIRA_BASE_URL: ${{ inputs.jira-base-url }}
        JIRA_EMAIL: ${{ inputs.jira-user-email }}
        JIRA_TOKEN: ${{ inputs.jira-api-token }}
        ISSUE_KEY: ${{ steps.extract-key.outputs.key }}
        TARGET_STATUS: ${{ inputs.target-status }}
      run: |
        AUTH_HEADER=$(printf "%s:%s" "$JIRA_EMAIL" "$JIRA_TOKEN" | base64 -w 0)

        # 1. Fetch available transitions for the issue
        TRANSITIONS_JSON=$(curl -s -f -X GET \
          -H "Authorization: Basic $AUTH_HEADER" \
          -H "Accept: application/json" \
          "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions")

        # 2. Match target status name (case-insensitive) to get its transition ID
        TRANSITION_ID=$(echo "$TRANSITIONS_JSON" | jq -r --arg status "$TARGET_STATUS" \
          '.transitions[] | select(.to.name | ascii_downcase == ($status | ascii_downcase)) | .id' | head -n 1)

        if [ -z "$TRANSITION_ID" ]; then
          echo "Error: Target status '$TARGET_STATUS' is not a valid transition for $ISSUE_KEY."
          echo "Available transitions:"
          echo "$TRANSITIONS_JSON" | jq -r '.transitions[] | "- \(.to.name) (ID: \(.id))"'
          exit 1
        fi

        # 3. Execute the state transition
        curl -s -f -X POST \
          -H "Authorization: Basic $AUTH_HEADER" \
          -H "Content-Type: application/json" \
          --data "{\"transition\": {\"id\": \"$TRANSITION_ID\"}}" \
          "${JIRA_BASE_URL}/rest/api/3/issue/${ISSUE_KEY}/transitions"

        echo "Successfully moved $ISSUE_KEY to '$TARGET_STATUS'."
