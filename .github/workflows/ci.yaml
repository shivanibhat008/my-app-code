name: Selective Build & Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # ======================
  # JOB 1: Detect Changes
  # ======================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  pr-title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce version format in PR Title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          
          # Checks for v followed by three number blocks (e.g., v1.1.0)
          if [[ ! "$PR_TITLE" =~ v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Validation Failed!"
            echo "Your PR title is: '$PR_TITLE'"
            echo "It must contain a version format like 'v1.1.0'."
            echo "Please rename your PR to proceed."
            exit 1
          fi
          echo "Version format correctly detected in PR Title."

  # ====================
  # JOB 2: PR Pre-Checks
  # ====================
  pr-checks:
    needs: [detect-changes, pr-title-check]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.changes != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.changes) }}
      fail-fast: false 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile

      - name: SonarQube Scan
        run: echo "Passed the sonarQube scan"
        #uses: SonarSource/sonarcloud-github-action@master
        #env:
          #GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          #SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        #with:
          #args: >
            #-Dsonar.projectKey=YOUR_KEY
            #-Dsonar.sources=${{ matrix.component }}/

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.component }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Set to 0 temporarily

  # ======================
  # JOB 3: Build & Deploy
  # ======================
  build-deploy:
    needs: detect-changes
    if: github.event_name == 'push' && needs.detect-changes.outputs.changes != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.changes) }}
      fail-fast: false 

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Immutable SHA Tag
        id: meta
        run: |
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)         
          FINAL_TAG="${VERSION}-sha-${GITHUB_SHA::7}"
          
          echo "Extracted Version: $VERSION"
          echo "Building image with tag: $FINAL_TAG"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"

      - name: Build Docker Image
        run: |
          docker build -t local-${{ matrix.component }}:${{ steps.meta.outputs.tag }} ./${{ matrix.component }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Image to Docker Hub
        run: |
          docker tag local-${{ matrix.component }}:${{ steps.meta.outputs.tag }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ci-cd

      - name: Trigger Dev Deployment Webhook
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/ci-cd/dispatches \
            -d '{
              "event_type": "deploy-dev",
              "client_payload": { 
                "component": "${{ matrix.component }}", 
                "image_tag": "${{ steps.meta.outputs.tag }}" 
              }
            }'
