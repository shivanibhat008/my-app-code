name: Selective Build & Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'hotfix/*'

jobs:
  # ======================
  # JOB 1: Detect Changes
  # ======================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

      # Extract the semantic version globally so both build and deploy jobs can inherit it
      - name: Extract Version from Commit Message
        id: get-version
        if: github.event_name == 'push'
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Error: No semantic version found in commit message!"
            exit 1
          fi

          echo "Extracted Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ============================================================
  # JOB 2: Version Format Check (PR Title on PRs, Commit on Push)
  # ============================================================
  pr-title-check:
    needs: detect-changes
    if: github.event_name == 'pull_request' || needs.detect-changes.outputs.changes != '[]'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate-version.outputs.version }}
    steps:
      - name: Enforce semantic version format
        id: validate-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            SOURCE="PR title"
            TEXT_TO_CHECK="$PR_TITLE"
          else
            SOURCE="commit message"
            TEXT_TO_CHECK="$COMMIT_MSG"
          fi

          VERSION=$(echo "$TEXT_TO_CHECK" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)

          if [ -z "$VERSION" ]; then
            echo "Validation Failed!"
            echo "Your $SOURCE is: '$TEXT_TO_CHECK'"
            echo "It must contain a semantic version format like 'v1.1.0'."
            exit 1
          fi

          echo "Semantic version $VERSION detected in $SOURCE."
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ====================
  # JOB 3: PR Pre-Checks
  # ====================
  pr-checks:
    needs: [detect-changes, pr-title-check]
    if: |
      needs.detect-changes.outputs.changes != '[]' &&
      (
        github.event_name == 'pull_request' ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/hotfix/'))
      )
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.changes) }}
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Unit Tests
        run: echo "Running unit tests for ${{ matrix.component }}"

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.component }}/Dockerfile

      - name: SonarQube Scan
        run: echo "Passed the sonarQube scan"

      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './${{ matrix.component }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ======================
  # JOB 4: Build & Push
  # ======================
  build-push-docker:
    needs: [detect-changes, pr-checks]
    if: |
      always() &&
      github.event_name == 'push' &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.changes != '[]' &&
      (needs.pr-checks.result == 'success' || needs.pr-checks.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.changes) }}
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Construct Final Tag
        id: meta
        env:
          BASE_VERSION: ${{ needs.detect-changes.outputs.version }}
        run: |
          FINAL_TAG="${BASE_VERSION}-sha-${GITHUB_SHA::7}"
          echo "Building image with tag: $FINAL_TAG"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"
          echo "**${{ matrix.component }}** image tag: \`${FINAL_TAG}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build Docker Image
        run: |
          docker build -t local-${{ matrix.component }}:${{ steps.meta.outputs.tag }} ./${{ matrix.component }}

      - name: Scan Built Image Layers (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'local-${{ matrix.component }}:${{ steps.meta.outputs.tag }}'
          format: 'table'
          vuln-type: 'os,library'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Image to Docker Hub
        run: |
          docker tag local-${{ matrix.component }}:${{ steps.meta.outputs.tag }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}

  # ======================
  # JOB 5: Deploy to Dev
  # ======================
  deploy-dev:
    needs: [detect-changes, build-push-docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.changes != '[]'
    strategy:
      matrix:
        component: ${{ fromJSON(needs.detect-changes.outputs.changes) }}
      fail-fast: false

    uses: shivanibhat008/ci-cd/.github/workflows/deploy-dev.yaml@main
    with:
      base_version: ${{ needs.detect-changes.outputs.version }}
      component: ${{ matrix.component }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      CI_APP_ID: ${{ secrets.CI_APP_ID }}
      CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}

