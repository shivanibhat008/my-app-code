name: Build, Scan & Trigger Dev Deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/hello-app

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Auto-generate short commit SHA tag on PRs and main merges
      - name: Generate Immutable SHA Tag
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "image_tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: sha-${SHORT_SHA}"

      # 2. Build image locally (runs on both PRs and main merges)
      - name: Build Docker Image
        run: |
          docker build -t $IMAGE_NAME:${{ steps.meta.outputs.image_tag }} ./app

      # 3. Scan local image with Trivy before pushing
      - name: Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}"
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      # 4. Login & Push to Docker Hub ONLY when merged into main
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Immutable SHA Image to Docker Hub
        if: github.event_name == 'push'
        run: |
          docker push $IMAGE_NAME:${{ steps.meta.outputs.image_tag }}

      # 5. Mint GitHub App token & notify platform-ci-cd to update dev overlay
      - name: Generate GitHub App Token
        if: github.event_name == 'push'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: platform-ci-cd

      - name: Trigger Dev Deployment in platform-ci-cd
        if: github.event_name == 'push'
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/platform-ci-cd/dispatches \
            -d '{
              "event_type": "deploy-to-dev",
              "client_payload": {
                "image_tag": "${{ steps.meta.outputs.image_tag }}"
              }
            }'